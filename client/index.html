<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/stars.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Sniglet:wght@400;800&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030712" />
    <meta name="description" content="Shiny Quest is a Pokémon shiny hunting tracker. Log your hunts, count encounters, and celebrate every shiny you find." />
    <title>Shiny Quest</title>
    <style>
      /* Shown before the JS bundle arrives; React replaces it with the matching PageLoader overlay */
      #boot-loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #030712; }
      #boot-loader span { width: 4rem; height: 4rem; border: 6px solid #fbbf24; border-top-color: transparent; border-radius: 9999px; animation: boot-spin 1s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot-loader"><span role="status" aria-label="Loading"></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: CI

on:
  push:
  pull_request:

jobs:
  test-server:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      
      - run: npm ci

      - run: npm test

      - run: npm run build

  build-client:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      
      - run: npm ci

      - run: npm run lint

      - run: npm run build